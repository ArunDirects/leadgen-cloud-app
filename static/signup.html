<!DOCTYPE html>
<html>
<head>
  <title>Request Access</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 40px;
    }

    .box {
      background: white;
      max-width: 400px;
      margin: auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
    }

    button {
      background: black;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Request Access</h2>

  <input type="email" id="email" placeholder="Enter Email">

  <input type="password" id="password" placeholder="Create Password">

  <button onclick="signupUser()">Submit Request</button>

  <p id="message"></p>

  <a href="login.html">Already approved? Login here</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>

</body>
</html>
