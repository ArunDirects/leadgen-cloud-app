<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Lead Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:'DM Sans',Arial,sans-serif;background:#f5f6fa;color:#162033;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
    .box{width:100%;max-width:420px;background:#fff;border:1px solid #e2e6f0;border-radius:16px;box-shadow:0 8px 30px rgba(20,30,50,.08);padding:30px}
    h1{margin:0 0 8px;font-size:26px}
    p{color:#69758c}
    input{width:100%;border:1.5px solid #e2e6f0;border-radius:10px;padding:12px;font-size:15px;margin-top:12px}
    button{width:100%;border:none;border-radius:10px;padding:12px 15px;font-weight:800;cursor:pointer;background:#00a96e;color:#fff;margin-top:14px}
    a{display:block;text-align:center;margin-top:16px;color:#0077cc;text-decoration:none;font-weight:700}
    #message{font-size:14px;color:#d92d20;min-height:20px}
  </style>
</head>
<body>
  <div class="box">
    <h1>Login</h1>
    <p>Login after your access is approved.</p>

    <input type="email" id="email" placeholder="Enter email">
    <input type="password" id="password" placeholder="Enter password">

    <button onclick="loginUser()">Login</button>

    <p id="message"></p>

    <a href="signup.html">Need access? Request here</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
</body>
</html>
