<script>
let allLeads = [];

function populateCities() {
  const state = document.getElementById("stateSelect").value;
  const citySelect = document.getElementById("citySelect");

  const citiesByState = {
    "Andhra Pradesh": ["Visakhapatnam", "Vijayawada", "Guntur", "Tirupati"],
    "Delhi": ["New Delhi", "Delhi"],
    "Gujarat": ["Ahmedabad", "Surat", "Vadodara", "Rajkot"],
    "Karnataka": ["Bengaluru", "Mysuru", "Mangalore", "Hubballi"],
    "Maharashtra": ["Mumbai", "Pune", "Nagpur", "Nashik"],
    "Tamil Nadu": ["Chennai", "Coimbatore", "Madurai", "Tiruchirappalli"],
    "Telangana": ["Hyderabad", "Warangal", "Nizamabad"],
    "Uttar Pradesh": ["Lucknow", "Noida", "Ghaziabad", "Kanpur"],
    "West Bengal": ["Kolkata", "Howrah", "Durgapur"]
  };

  citySelect.innerHTML = '<option value="">— Select City —</option>';

  if (citiesByState[state]) {
    citiesByState[state].forEach(city => {
      const option = document.createElement("option");
      option.value = city;
      option.textContent = city;
      citySelect.appendChild(option);
    });
  }
}

function updateRadius(value) {
  const km = value / 1000;
  const miles = (km * 0.621371).toFixed(1);
  document.getElementById("radiusLabel").textContent = `${km} km · ${miles} mi`;
}

async function runSearch() {
  const button = document.querySelector(".run-btn");

  try {
    const state = document.getElementById("stateSelect").value;
    const city = document.getElementById("citySelect").value;
    const categoryElement = document.getElementById("category");
    const category = categoryElement.value;
    const radius = parseInt(document.getElementById("radius").value || "8000");
    const maxResults = parseInt(document.getElementById("maxResults").value || "20");

    if (!state) {
      alert("Please select a state.");
      return;
    }

    if (!city) {
      alert("Please select a city.");
      return;
    }

    if (!category) {
      alert("Please select a business category.");
      return;
    }

    button.disabled = true;
    button.innerHTML = "⏳ Generating Leads...";

    const payload = {
      query: category,
      location: `${city}, ${state}`,
      radius: radius,
      max_results: maxResults,
      city: city,
      state: state
    };

    console.log("Sending payload:", payload);

    const response = await fetch("/search", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    const data = await response.json();
    console.log("Search response:", data);

    if (data.error) {
      alert("Error: " + data.error);
      return;
    }

    allLeads = data.leads || [];

    const resultsSection = document.getElementById("resultsSection");
    const tableBody = document.getElementById("tableBody");
    const countBadge = document.getElementById("countBadge");

    if (countBadge) {
      countBadge.textContent = allLeads.length;
    }

    if (tableBody) {
      tableBody.innerHTML = "";

      if (allLeads.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="7" style="text-align:center;padding:25px;">
              No businesses without websites found.
            </td>
          </tr>
        `;
      } else {
        allLeads.forEach((lead, index) => {
          const row = document.createElement("tr");

          row.innerHTML = `
            <td>${index + 1}</td>
            <td>${escapeHtml(lead.name || lead.business_name || "")}</td>
            <td>${escapeHtml(lead.category || "")}</td>
            <td>${escapeHtml(lead.address || "")}</td>
            <td>${escapeHtml(lead.phone || "")}</td>
            <td><span class="no-site-tag">No Website</span></td>
            <td>
              <a class="maps-link" href="${lead.mapsUrl || lead.maps_url || "#"}" target="_blank">
                View ↗
              </a>
            </td>
          `;

          tableBody.appendChild(row);
        });
      }
    }

    if (resultsSection) {
      resultsSection.style.display = "block";
    }

    alert(`Success! ${allLeads.length} leads found and saved to database.`);

  } catch (error) {
    console.error("Search error:", error);
    alert("Something went wrong. Please check browser console and Render logs.");
  } finally {
    if (button) {
      button.disabled = false;
      button.innerHTML = "🔍 Generate Leads & Save to Database";
    }
  }
}

function downloadCSV() {
  if (!allLeads || allLeads.length === 0) {
    alert("No leads available to download.");
    return;
  }

  const headers = [
    "Business Name",
    "Category",
    "Address",
    "City",
    "State",
    "Phone",
    "Google Maps URL",
    "Date Found"
  ];

  const rows = allLeads.map(lead => [
    lead.name || lead.business_name || "",
    lead.category || "",
    lead.address || "",
    lead.city || "",
    lead.state || "",
    lead.phone || "",
    lead.mapsUrl || lead.maps_url || "",
    lead.date || lead.date_found || ""
  ]);

  const csvContent = [headers, ...rows]
    .map(row => row.map(value => `"${String(value).replace(/"/g, '""')}"`).join(","))
    .join("\n");

  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = url;
  link.download = `leads_${new Date().toISOString().slice(0, 10)}.csv`;
  link.click();

  URL.revokeObjectURL(url);
}

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

document.addEventListener("DOMContentLoaded", function () {
  const radiusInput = document.getElementById("radius");
  if (radiusInput) {
    updateRadius(radiusInput.value);
  }
});
</script>
